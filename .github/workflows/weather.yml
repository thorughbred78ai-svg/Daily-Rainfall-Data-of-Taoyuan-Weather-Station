name: Taoyuan Weather

on:
  workflow_dispatch:
    inputs:
      input_date:
        description: "指定預報日期，例如 2026-09-25；留空使用台灣當天日期"
        required: false
        default: ""
        type: string

      input_locations:
        description: "指定行政區，例如 桃園區,中壢區,龜山區；留空使用全部 13 區"
        required: false
        default: ""
        type: string

      send_telegram:
        description: "是否推送 Telegram"
        required: false
        default: true
        type: boolean

  schedule:
    # GitHub Actions cron 使用 UTC。
    # 這裡設定每小時執行一次。
    # 00:00 UTC = 台灣 08:00
    # 01:00 UTC = 台灣 09:00
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  weather:
    name: Taoyuan Weather
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------
      # Python dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ------------------------------------------------------
      # 執行天氣程式
      # ------------------------------------------------------

      - name: Run weather
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          INPUT_DATE: ${{ inputs.input_date }}

          INPUT_LOCATIONS: ${{ inputs.input_locations }}

          SEND_TELEGRAM: ${{ inputs.send_telegram || 'true' }}

        run: |
          python scripts/weather.py
