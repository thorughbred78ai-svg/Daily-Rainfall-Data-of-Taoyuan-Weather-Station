name: 桃園地面測站每日雨量

on:
  # 台灣時間每 8 小時執行一次
  schedule:
    - cron: "0 0,8,16 * * *"
      timezone: "Asia/Taipei"

  # GitHub Actions 手動執行
  workflow_dispatch:
    inputs:
      stations:
        description: "測站名稱，可用逗號或頓號分隔，例如：新屋,八德,蘆竹,龜山,中壢"
        required: false
        default: "新屋,八德,蘆竹,龜山,中壢"
        type: string


permissions:
  contents: read


jobs:
  weather:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      REQUESTED_STATIONS: ${{ inputs.stations }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Check configuration
        shell: bash
        run: |

          if [ -z "$CWA_API_KEY" ]; then
            echo "::error::缺少 CWA_API_KEY"
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::缺少 TELEGRAM_BOT_TOKEN"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::缺少 TELEGRAM_CHAT_ID"
            exit 1
          fi

          echo "CWA_API_KEY: OK"
          echo "TELEGRAM_BOT_TOKEN: OK"
          echo "TELEGRAM_CHAT_ID: OK"


      - name: Run weather bot
        run: |
          python scripts/weather.py
